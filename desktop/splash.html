<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cygnus</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05060d;
        color: #e7ecff;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background:
          radial-gradient(420px 260px at 78% 8%, rgba(84, 112, 220, 0.2), transparent 70%),
          radial-gradient(380px 240px at 12% 100%, rgba(72, 190, 190, 0.12), transparent 72%),
          #05060d;
        border: 1px solid rgba(141, 166, 255, 0.16);
      }
      .stars {
        position: absolute;
        inset: 0;
        opacity: 0.55;
        background-image:
          radial-gradient(1px 1px at 22px 48px, #dce6ff 50%, transparent 51%),
          radial-gradient(1px 1px at 112px 88px, #9fb8ff 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 190px 28px, #ffffff 50%, transparent 51%),
          radial-gradient(1px 1px at 304px 114px, #c8d6ff 50%, transparent 51%),
          radial-gradient(1px 1px at 382px 54px, #8fa9e8 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 428px 168px, #ffffff 50%, transparent 51%),
          radial-gradient(1px 1px at 58px 198px, #b9c9ff 50%, transparent 51%),
          radial-gradient(1px 1px at 248px 232px, #8298d8 50%, transparent 51%);
        background-repeat: repeat;
      }
      .mark {
        width: 58px;
        height: 58px;
        margin-bottom: 18px;
        filter: drop-shadow(0 0 16px rgba(154, 181, 255, 0.25));
      }
      h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      p {
        margin: 9px 0 0;
        color: #8e9cc0;
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }
      .bar {
        width: 156px;
        height: 2px;
        margin-top: 24px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(142, 160, 210, 0.17);
      }
      .bar span {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #9db9ff, transparent);
        animation: slide 1.25s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <g stroke="#a9c2ff" stroke-width="0.9" opacity="0.55">
        <path d="M16 4 11 15l5 5 5-5Z" />
        <path d="M11 15 5 19M21 15l6 4M16 20v7" />
        <path d="M16 4 25 7M16 20l9 1" opacity="0.45" />
      </g>
      <g fill="#e5ecff">
        <circle cx="16" cy="4" r="2.1" />
        <circle cx="11" cy="15" r="1.35" />
        <circle cx="21" cy="15" r="1.35" />
        <circle cx="16" cy="27" r="1.25" />
        <circle cx="25" cy="7" r="1" />
        <circle cx="25" cy="21" r="0.9" />
      </g>
    </svg>
    <h1>Cygnus</h1>
    <p>Waking the local workspace…</p>
    <div class="bar" aria-hidden="true"><span></span></div>
  </body>
</html>

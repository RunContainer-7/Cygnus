<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cygnus docs</title>
    <meta
      name="description"
      content="Cygnus documentation: install, pick a model, prompt, preview, publish and troubleshoot the local-first AI app builder."
    />
    <meta name="theme-color" content="#050606" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" data-link>
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <circle cx="16" cy="16" r="11.5" fill="none" stroke="currentColor" stroke-width="1.4" />
              <circle cx="16" cy="4.5" r="2.1" fill="currentColor" />
              <circle cx="26.6" cy="21.5" r="1.7" fill="currentColor" />
              <circle cx="5.4" cy="21.5" r="1.7" fill="currentColor" />
              <path d="M16 10.5l1.7 3.8 3.8 1.7-3.8 1.7-1.7 3.8-1.7-3.8-3.8-1.7 3.8-1.7z" fill="currentColor" />
            </svg>
          </span>
          <span class="brand-name">Cygnus</span>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-docs">Docs</span>
        </a>

        <div class="topbar-actions">
          <a class="topbar-download" href="/download" data-link>Download</a>
          <a
            class="topbar-link"
            href="https://github.com/RunContainer-7/Cygnus/releases"
            target="_blank"
            rel="noreferrer"
          >
            Release notes
          </a>
          <a class="topbar-link" href="https://github.com/RunContainer-7/Cygnus" target="_blank" rel="noreferrer">
            GitHub
          </a>
          <span class="topbar-version" id="doc-version"></span>
          <button class="search-trigger" id="search-trigger" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16 16 4.5 4.5" />
            </svg>
            <span>Search docs</span>
            <kbd id="search-hint">⌘K</kbd>
          </button>
          <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar" id="sidebar">
          <nav class="sidebar-nav" id="sidebar-nav" aria-label="Documentation"></nav>
          <div class="sidebar-foot">
            <a href="/download" data-link>Download Cygnus</a>
            <a href="https://github.com/RunContainer-7/Cygnus" target="_blank" rel="noreferrer">Cygnus on GitHub</a>
            <span>MIT licensed</span>
          </div>
        </aside>

        <main class="main" id="main">
          <article class="doc" id="doc">
            <div class="doc-loading">Loading documentation…</div>
          </article>
          <footer class="doc-foot">
            <a class="doc-edit" id="edit-link" href="https://github.com/RunContainer-7/Cygnus" target="_blank" rel="noreferrer">
              Edit this page
            </a>
            <span>Cygnus · local-first AI app builder</span>
          </footer>
        </main>

        <aside class="toc" id="toc" aria-label="On this page"></aside>
      </div>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <div class="search-modal" id="search-modal" hidden>
      <div class="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-label">
        <div class="search-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 4.5 4.5" />
          </svg>
          <input
            id="search-input"
            type="search"
            placeholder="Search the Cygnus docs…"
            autocomplete="off"
            spellcheck="false"
            aria-labelledby="search-label"
          />
          <span class="search-label sr-only" id="search-label">Search the Cygnus docs</span>
          <kbd>Esc</kbd>
        </div>
        <div class="search-results" id="search-results"></div>
        <div class="search-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> to move</span>
          <span><kbd>↵</kbd> to open</span>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
